<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ministry of Magic | Level Black</title>

    <link rel="stylesheet" href="index.css">

</head>


<body>

<main class="emergency-screen">


    <!-- Magical particles -->

    <div class="magic-particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- Language -->

    <div class="language-switch">

        <button id="englishBtn"
                class="active">
            EN
        </button>

        <span>|</span>

        <button id="arabicBtn">
            AR
        </button>

    </div>


    <!-- Main Ministry Alert -->

    <section class="emergency-card">


        <!-- Warning -->

        <div class="warning-symbol">
            ⚠
        </div>


        <!-- Ministry -->

        <p class="ministry"
           data-en="MINISTRY OF MAGIC"
           data-ar="وزارة السحر">
            MINISTRY OF MAGIC
        </p>


        <p class="department"
           data-en="DEPARTMENT OF MAGICAL EMERGENCIES"
           data-ar="قسم الطوارئ السحرية">

            DEPARTMENT OF MAGICAL EMERGENCIES

        </p>


        <!-- Classified -->

        <div class="classified">

            <span
                data-en="CLASSIFIED"
                data-ar="سري للغاية">

                CLASSIFIED

            </span>

            <b>//</b>

            <span
                data-en="LEVEL BLACK"
                data-ar="المستوى الأسود">

                LEVEL BLACK

            </span>

        </div>


        <!-- Main message -->

        <div class="main-message">

            <h1
                data-en="SOMETHING IS WRONG WITH MAGIC"
                data-ar="هُنَاكَ خَطْبٌ مَا بِالسِّحْر">

                SOMETHING IS WRONG
                <br>
                WITH MAGIC

            </h1>


            <div class="divider"></div>


            <p
                data-en="The magical world is changing."
                data-ar="العالم السحري يتغير.">

                The magical world is changing.

            </p>


            <p
                data-en="Something has begun to affect magic."
                data-ar="شيء ما بدأ يؤثر في السحر.">

                Something has begun to affect magic.

            </p>

        </div>


        <!-- Case -->

        <div class="case-info">


            <div>

                <span
                    data-en="CASE"
                    data-ar="القضية">

                    CASE

                </span>

                <strong>
                    001
                </strong>

            </div>


            <div>

                <span
                    data-en="STATUS"
                    data-ar="الحالة">

                    STATUS

                </span>

                <strong
                    data-en="ACTIVE"
                    data-ar="نشطة">

                    ACTIVE

                </strong>

            </div>


        </div>


        <!-- Enter -->

        <button id="enterButton">

            <span>
                ✦
            </span>

            <strong
                data-en="ENTER THE INVESTIGATION"
                data-ar="ابدأ التحقيق">

                ENTER THE INVESTIGATION

            </strong>

            <span>
                →
            </span>

        </button>


        <!-- Footer -->

        <p class="security-text"
           data-en="MINISTRY SECURITY PROTOCOL"
           data-ar="بروتوكول أمن وزارة السحر">

            MINISTRY SECURITY PROTOCOL

        </p>


    </section>


</main>


<script src="script.js"></script>

</body>

</html>
