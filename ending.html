<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Case 001 | Final Record</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="ending.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background"></div>

    <div class="dark-overlay"></div>


    <!-- =====================================================
         LANGUAGE
    ====================================================== -->

    <button
        id="languageToggle"
        class="language-button"
    >
        AR
    </button>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="ending">


        <!-- CASE LABEL -->

        <div
            class="case-label"
            data-en="CASE FILE 001 — FINAL RECORD"
            data-ar="ملف القضية 001 — السجل النهائي"
        >
            CASE FILE 001 — FINAL RECORD
        </div>


        <!-- TERMINAL / RECORD -->

        <section class="record">


            <div
                id="recordText"
                class="record-text"
            ></div>


            <div
                id="cursor"
                class="cursor"
            >
                ▌
            </div>


        </section>


        <!-- CLOSED CASE -->

        <section
            id="closedSection"
            class="closed-section"
        >

            <div
                class="closed-line"
                data-en="CASE 001"
                data-ar="القضية 001"
            >
                CASE 001
            </div>


            <div
                class="closed-title"
                data-en="CLOSED"
                data-ar="مغلقة"
            >
                CLOSED
            </div>


            <button
                id="restartButton"
                class="restart-button"
                data-en="REOPEN CASE"
                data-ar="إعادة فتح القضية"
            >
                REOPEN CASE
            </button>

        </section>


    </main>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script src="ending.js"></script>

</body>

</html>
